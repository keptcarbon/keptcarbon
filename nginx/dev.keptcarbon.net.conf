# ─────────────────────────────────────────────────────────────
# Reference nginx server block for dev.keptcarbon.net.
#
# nginx runs on the HOST (not in this repo's docker-compose), so
# this file is documentation/reference only. Install it manually:
#
#   sudo cp nginx/dev.keptcarbon.net.conf /etc/nginx/sites-available/dev.keptcarbon.net
#   sudo ln -s /etc/nginx/sites-available/dev.keptcarbon.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dev.keptcarbon.net   # provisions SSL, rewrites this file
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name dev.keptcarbon.net;

    # FastAPI backend (keptcarbon-backend-dev, :8001)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend + API routes (keptcarbon-dev, :3500)
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev server HMR websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
