name: Deploy to UAT

on:
  push:
    branches: [uat]

concurrency:
  group: deploy-uat
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # ── Safety brake: never auto-deploy a commit that touches a DB migration.
  # Migrations follow the manual runbook process (see postgis/migrations/*_DEPLOY_RUNBOOK.md).
  check-migrations:
    name: Check for migration changes
    runs-on: ubuntu-latest
    outputs:
      has_migration: ${{ steps.check.outputs.has_migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -n "$BEFORE" ]; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- postgis/migrations/)
          else
            CHANGED=""
          fi
          if [ -n "$CHANGED" ]; then
            echo "has_migration=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Merge นี้แตะ postgis/migrations/ — auto-deploy ถูกข้าม ทำ deploy มือตาม runbook"
            echo "$CHANGED"
          else
            echo "has_migration=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & push images
    needs: check-migrations
    if: needs.check-migrations.outputs.has_migration == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-backend:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nextjs
        uses: docker/build-push-action@v6
        with:
          context: ./nextjs
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_API_URL=${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-nextjs:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-nextjs:uat-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to UAT VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.UAT_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.UAT_DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            git fetch origin uat
            git checkout uat
            git reset --hard origin/uat
            export TAG=${{ needs.build-and-push.outputs.tag }}
            docker compose -f docker-compose.yml -f docker-compose.uat.yml pull nextjs backend
            docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          curl -fsS "${{ secrets.UAT_HEALTHCHECK_URL }}" || (echo "::error::UAT health check failed after deploy" && exit 1)
